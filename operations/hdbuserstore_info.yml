---
# hdbuserstore_info.yml - HDB User Store キー情報の取得 (運用タスク)
#
# HANA Secure User Store (hdbuserstore) に登録されたキーの接続情報を確認する。
# SAP HANA の自動接続設定やバックアップ設定の確認に使用。

- name: Backup
  hosts: hana-qlx4m1

  tasks:
  # hdbuserstore のキー情報を取得 (rheadm ユーザーとして実行)
  - name: Get info about the key mykey from HDB user store
    sap.sap_operations.hdbuserstore_info:
      binary_path: /usr/sap/RHE/HDB00/exe
      key: RHESAPDBCTRLRHE
    register: output
    become: yes
    become_user: rheadm
  - name: debug var
    debug:
      msg: "{{ output }}"
