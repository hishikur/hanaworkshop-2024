---
# rfc.yml - SAP RFC 接続テスト (運用タスク)
#
# community.sap_operations の sap_pyrfc ロールを使用し、
# SAP S/4HANA への RFC 接続をテストする。
# PyRFC (SAP NW RFC SDK の Python バインディング) が必要。
#
# テスト対象:
#   STFC_CONNECTION - 基本的な RFC 接続確認 (ping 相当)
#   STFC_STRUCTURE  - 構造体データの送受信テスト

- name: RFC Connection to SAP
  hosts: localhost
  become: yes
  collections:
    - community.sap_operations

  vars:
    suser_id: 'S0020405660'
    suser_password: 'RW!6AmRMTwZ!7H5'
    sap_nwrfc_sdk: nwrfc750P_11-70002752.zip
    reuse_connection:
      ashost: s4hana-rfng9
      sysid: RHE
      sysnr: "00"
      client: "000"
      user: "SAP*"
      passwd: R3dh4t123!
      lang: EN

  tasks:

  # pyrfc_first_run: yes で初回に NW RFC SDK のインストールも実行
  - name: Run SAP RFC - STFC_CONNECTION
    vars:
      pyrfc_first_run: yes
      target_function: STFC_CONNECTION
      target_parameters:
        REQUTEXT: 'Hello SAP!'
      target_connection: "{{ reuse_connection }}"
    ansible.builtin.include_role:
      name: community.sap_operations.sap_pyrfc

  - name: DEBUG - Output of STFC_CONNECTION
    debug:
      msg: "{{ sap_rfc_output }}"

  # pyrfc_first_run: no — 2回目以降は SDK インストールをスキップ
  - name: Run SAP RFC - STFC_STRUCTURE
    vars:
      pyrfc_first_run: no
      target_function: STFC_STRUCTURE
      target_parameters:
        IMPORTSTRUCT:
          RFCINT1: 128
        RFCTABLE:
          - RFCDATA1: test
      target_connection: "{{ reuse_connection }}"
    ansible.builtin.include_role:
      name: community.sap_operations.sap_pyrfc

  - name: DEBUG - Output of STFC_STRUCTURE
    debug:
      msg: "{{ sap_rfc_output }}"
      