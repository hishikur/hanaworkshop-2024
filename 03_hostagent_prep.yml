---
# 03_hostagent_prep.yml - SAP Host Agent インストール
#
# SAP Host Agent は HANA のライフサイクル管理に必要なエージェントサービス。
# NFS 共有 (/nfs/SAPHOSTAGENT) に配置済みの RPM パッケージからインストールする。
# community.sap_install コレクションの sap_hostagent ロールを使用。

- name: Host Agent installation
  hosts: hanas
  become: yes
  collections:
    - community.sap_install

  vars:
    sap_hostagent_installation_type: rpm
    sap_hostagent_rpm_local_path: /nfs/SAPHOSTAGENT
    sap_hostagent_rpm_file_name: saphostagentrpm_44-20009394.rpm
    sap_hostagent_clean_tmp_directory: true

  roles:
    - role: sap_hostagent

