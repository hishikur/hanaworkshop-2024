---
# 02_storage_prep.yml - SAP HANA 用ファイルシステム作成
#
# vdb ディスク上に LVM ボリュームグループ "sap" を作成し、
# SAP HANA に必要な4つのファイルシステムをマウントする。
# サイズは SAP Note 2009879 の推奨に基づく。
#   /hana/data   - データファイル (128 GiB, XFS)
#   /hana/log    - ログファイル (64 GiB, XFS)
#   /hana/shared - 共有ファイル (256 GiB, XFS)
#   /usr/sap     - SAP バイナリ (50 GiB)

- name: Create filesystem for SAP HANA
  hosts: hanas

  vars:
    storage_pools:
      - name: sap
        disks:
          - vdb
        volumes:
          - name: data
            size: "128 GiB"
            mount_point: "/hana/data"
            fs_type: xfs
            state: present
          - name: log
            size: "64 GiB"
            mount_point: "/hana/log"
            fs_type: xfs
            state: present
          - name: shared
            size: "256 GiB"
            mount_point: "/hana/shared"
            fs_type: xfs
            state: present
          - name: sap
            size: "50 GiB"
            mount_point: "/usr/sap"
            state: present

  roles:
    - role: rhel-system-roles.storage


