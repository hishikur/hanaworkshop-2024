---
# 03_s4_hostagent_prep.yml - S/4HANA AP サーバー用 SAP Host Agent インストール
#
# S/4HANA アプリケーションサーバー (s4hanas グループ) に Host Agent をインストール。
# 03_hostagent_prep.yml と同様のパラメータで、対象ホストグループが異なる。

- name: Host Agent installation
  hosts: s4hanas
  become: yes
  collections:
    - community.sap_install

  vars:
    sap_hostagent_installation_type: rpm
    sap_hostagent_rpm_local_path: /nfs/SAPHOSTAGENT
    sap_hostagent_rpm_file_name: saphostagentrpm_44-20009394.rpm
    sap_hostagent_clean_tmp_directory: true

  roles:
    - sap_hostagent
