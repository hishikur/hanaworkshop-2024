---
# 02_s4_storage_prep.yml - S/4HANA アプリケーションサーバー用ストレージ準備
#
# sdb ディスクに LVM ボリュームグループを作成し、以下をマウント:
#   /usr/sap    - SAP バイナリ (50 GiB)
#   /usr/sapmnt - SAP マウントポイント (20 GiB)
#   swap        - スワップ領域 (21 GiB)

- name: Create filesystem for SAP HANA
  hosts: s4hanas

  vars:
    storage_pools:
      - name: sap
        disks:
          - sdb
        volumes:
          - name: sap
            size: "50 GiB"
            mount_point: "/usr/sap"
            state: present
          - name: sapmnt
            size: "20 GiB"
            mount_point: "/usr/sapmnt"
            state: present
          - name: swap
            fs_type: swap
            size: "21 GiB"
            state: present


  roles:
    - rhel-system-roles.storage
