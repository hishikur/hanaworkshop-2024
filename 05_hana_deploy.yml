---
# 05_hana_deploy.yml - SAP HANA データベースインストール
#
# community.sap_install の sap_hana_install ロールで HANA をインストール。
# インストールパラメータ (SID, インスタンス番号, パスワード, メディアパス等) は
# group_vars/hanas で定義済み (00_run_script.yml でテンプレートから自動生成)。
# 以下のコメントアウト変数は group_vars 側に移動済みのため、ここでは不要。

- name: Install SAP HANA Database
  hosts: hanas

  vars:
#    sap_hana_install_software_directory: /software/HANA_installation
#    sap_hana_install_common_master_password: "R3dh4t123!"
#    sap_hana_install_sid: 'RHE'
#    sap_hana_install_instance_number: '00'
#    sap_hana_install_software_extract_directory: "/tmp/inst"
 #   sap_hana_install_sapcar_filename: "../../../software/SAPCAR/SAPCAR_1311-80000935.EXE"

  roles:
    - role: sap_hana_install
